# Runs this Action against the repository owner's real account, the same way
# a user would. Needs a fine-grained token in the LANGS_TOKEN secret.
name: Live cards

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.LANGS_TOKEN != '' }}
    steps:
      - name: Skip without token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::LANGS_TOKEN secret is not set; skipping live run."
      - uses: actions/checkout@v6
        if: env.HAS_TOKEN == 'true'
      - uses: ./
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.LANGS_TOKEN }}
          output-dir: profile
          hide-languages: HTML,CSS,VBA,Rich Text Format,SCSS,Jupyter Notebook,Dockerfile,Makefile,Procfile,Batchfile,Roff
          commit-message: "chore: refresh live cards"
