name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Demo render
        run: python3 src/cards.py --demo --output-dir out
